
<style>
  @font-face {
    font-family: 'Juache';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/BMJUA.woff') format('woff');
    font-weight: normal;
    font-display: swap;
}

  * { box-sizing: border-box; margin: 0; padding: 0; }

  .lt-root {
    min-height: 100vh;
    background: #f0fdfe;
    font-family: 'Juache', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 80px;
    position: relative;
    overflow: hidden;
  }

  .sparkle-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .lt-content {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .avatar-wrap {
    position: relative;
    width: 96px;
    height: 96px;
    margin-bottom: 16px;
  }

  .avatar {
    overflow:hidden;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: linear-gradient(135deg, #3ddbe1 0%, #a8f0f3 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    border: 3px solid #fff;
    box-shadow: 0 0 0 3px #3ddbe1;
    animation: avatar-bob 3s ease-in-out infinite;
  }

  .avatar img {
    width: 100%;
    height: 100%;
  }

  @keyframes avatar-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .avatar-ring {
    position: absolute;
    top: -6px; left: -6px;
    width: 108px; height: 108px;
    border-radius: 50%;
    border: 2px dashed #3ddbe1;
    animation: ring-spin 12s linear infinite;
    opacity: 0.5;
  }

  @keyframes ring-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .profile-name {
    font-size: 22px;
    font-weight: 700;
    color: #1a8f94;
    letter-spacing: -0.3px;
    margin-bottom: 6px;
  }

  .profile-bio {
    font-size: 14px;
    color: #5bbfc4;
    text-align: center;
    line-height: 1.6;
    margin-bottom: 32px;
    max-width: 320px;
  }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #3ddbe1;
    margin-bottom: 10px;
    align-self: flex-start;
  }

  .links-group {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 28px;
  }

  .lt-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 14px 20px;
    border-radius: 16px;
    background: #fff;
    border: 1.5px solid #c4f3f5;
    text-decoration: none;
    color: #1a8f94;
    font-size: 15px;
    font-weight: 500;
    font-family: 'Juache', sans-serif;
    cursor: pointer;
    transition: transform 0.18s cubic-bezier(.34,1.56,.64,1), box-shadow 0.18s, border-color 0.18s;
    position: relative;
    overflow: hidden;
  }

  .lt-btn:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 8px 24px rgba(61,219,225,0.25);
    border-color: #3ddbe1;
  }

  .lt-btn:active {
    transform: translateY(0) scale(0.98);
  }

  .lt-btn.accent {
    background: #3ddbe1;
    border-color: #3ddbe1;
    color: #fff;
  }

  .lt-btn.accent .btn-label { color: #fff; }
  .lt-btn.accent .btn-sub { color: rgba(255,255,255,0.75); }
  .lt-btn.accent .btn-icon { background: rgba(255,255,255,0.25); color: #fff; }

  .lt-btn.accent:hover {
    box-shadow: 0 8px 28px rgba(61,219,225,0.45);
  }

  .btn-icon {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: #edfcfd;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    transition: transform 0.2s;
  }

  .lt-btn:hover .btn-icon {
    transform: scale(1.15) rotate(-5deg);
  }

  .btn-text {
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .btn-label {
    font-size: 14px;
    font-weight: 600;
    color: #1a8f94;
    line-height: 1.3;
  }

  .btn-sub {
    font-size: 12px;
    color: #7dd6da;
    margin-top: 1px;
  }

  .btn-arrow {
    font-size: 16px;
    color: #b0eaec;
    transition: transform 0.2s, color 0.2s;
  }

  .lt-btn:hover .btn-arrow {
    transform: translateX(4px);
    color: #3ddbe1;
  }

  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(61,219,225,0.3);
    transform: scale(0);
    animation: ripple-anim 0.5s linear;
    pointer-events: none;
  }

  @keyframes ripple-anim {
    to { transform: scale(4); opacity: 0; }
  }

  .music-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #edfcfd;
    border: 1px solid #c4f3f5;
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 12px;
    color: #3ddbe1;
    font-weight: 500;
    margin-bottom: 20px;
    animation: badge-pulse 2s ease-in-out infinite;
  }

  @keyframes badge-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(61,219,225,0.3); }
    50% { box-shadow: 0 0 0 6px rgba(61,219,225,0); }
  }

  .dot-live {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #3ddbe1;
    display: inline-block;
    animation: dot-blink 1.2s ease-in-out infinite;
  }

  @keyframes dot-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  .socials-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 8px;
  }

  .social-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1.5px solid #c4f3f5;
    background: #fff;
    font-size: 13px;
    font-weight: 500;
    color: #3ddbe1;
    font-family: 'Juache', sans-serif;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.18s cubic-bezier(.34,1.56,.64,1), background 0.15s;
  }

  .social-pill:hover {
    transform: translateY(-3px) scale(1.06);
    background: #edfcfd;
  }

  .footer-text {
    margin-top: 40px;
    font-size: 12px;
    color: #b0d8da;
    text-align: center;
  }

  .star-pop {
    position: absolute;
    pointer-events: none;
    font-size: 16px;
    animation: star-float 0.9s ease forwards;
    z-index: 99;
  }

  @keyframes star-float {
    0% { transform: translateY(0) scale(0.5); opacity: 1; }
    100% { transform: translateY(-60px) scale(1.2); opacity: 0; }
  }

  .btn-bounce-in {
    animation: bounce-in 0.5s cubic-bezier(.34,1.56,.64,1) both;
  }

  @keyframes bounce-in {
    0% { transform: translateY(30px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }
</style>

<script>
(function() {
  const canvas = document.getElementById('sparkleCanvas');
  const ctx = canvas.getContext('2d');
  let W, H;
  const particles = [];
  const COLORS = ['#3ddbe1','#a8f0f3','#fff','#c4f3f5','#7dd6da'];

  function resize() {
    W = canvas.width = canvas.offsetWidth;
    H = canvas.height = canvas.offsetHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function rand(a, b) { return Math.random() * (b - a) + a; }

  class Sparkle {
    constructor(x, y, size, color, vx, vy) {
      this.x = x || rand(0, W);
      this.y = y || rand(0, H);
      this.size = size || rand(1.5, 4);
      this.color = color || COLORS[Math.floor(Math.random() * COLORS.length)];
      this.vx = vx || rand(-0.4, 0.4);
      this.vy = vy || rand(-0.8, -0.2);
      this.alpha = rand(0.4, 1);
      this.decay = rand(0.006, 0.014);
      this.twinkle = rand(0, Math.PI * 2);
      this.twinkleSpeed = rand(0.04, 0.1);
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.alpha -= this.decay;
      this.twinkle += this.twinkleSpeed;
    }
    draw() {
      const t = (Math.sin(this.twinkle) + 1) / 2;
      const a = this.alpha * (0.5 + t * 0.5);
      ctx.save();
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = this.color;
      const s = this.size;
      ctx.translate(this.x, this.y);
      ctx.beginPath();
      for (let i = 0; i < 4; i++) {
        ctx.rotate(Math.PI / 2);
        ctx.moveTo(0, 0);
        ctx.lineTo(s, 0);
        ctx.lineTo(s * 0.3, s * 0.3);
      }
      ctx.fill();
      ctx.restore();
    }
    dead() { return this.alpha <= 0; }
  }

  function spawnAmbient() {
    if (particles.length < 60) {
      particles.push(new Sparkle());
    }
  }

  function loop() {
    ctx.clearRect(0, 0, W, H);
    spawnAmbient();
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      particles[i].draw();
      if (particles[i].dead()) particles.splice(i, 1);
    }
    requestAnimationFrame(loop);
  }
  loop();

  window.sparkPop = function(e) {
    const rect = e.currentTarget.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    const cy = e.clientY - rect.top;
    const rootRect = document.getElementById('ltRoot').getBoundingClientRect();
    const px = e.clientX - rootRect.left;
    const py = e.clientY - rootRect.top;
    for (let i = 0; i < 18; i++) {
      const angle = (i / 18) * Math.PI * 2;
      const speed = rand(1.5, 4);
      particles.push(new Sparkle(
        px, py,
        rand(2, 5),
        COLORS[Math.floor(Math.random() * COLORS.length)],
        Math.cos(angle) * speed,
        Math.sin(angle) * speed - 1
      ));
    }

    const star = document.createElement('div');
    star.className = 'star-pop';
    star.textContent = ['✦','✧','⋆','✨','★'][Math.floor(Math.random()*5)];
    star.style.left = px + 'px';
    star.style.top = py + 'px';
    document.getElementById('ltRoot').appendChild(star);
    setTimeout(() => star.remove(), 900);
  };

  document.querySelectorAll('.lt-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
      const circle = document.createElement('div');
      circle.className = 'ripple';
      const r = Math.max(btn.offsetWidth, btn.offsetHeight);
      const rect = btn.getBoundingClientRect();
      circle.style.width = circle.style.height = r + 'px';
      circle.style.left = (e.clientX - rect.left - r/2) + 'px';
      circle.style.top = (e.clientY - rect.top - r/2) + 'px';
      btn.appendChild(circle);
      setTimeout(() => circle.remove(), 500);
    });
  });
})();
</script>
